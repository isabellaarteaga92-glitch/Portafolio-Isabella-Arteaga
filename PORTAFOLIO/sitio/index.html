<html lang="es">
<head>
  <meta charset="utf-8" />

  <meta name="twitter:card" content="summary_large_image" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    // Colores y tipografías de la marca: edítalos aquí.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mint: { 50: '#FFF7FA', 100: '#FDEAF1', 200: '#FCD3E2', 300: '#FCBCD4', 500: '#F08AB0', 700: '#A31F3D' } /* rosa */,
            sky: { 50: '#F7F7F7', 100: '#EFEFEF', 200: '#D9D8D8', 300: '#B5B3B3', 500: '#E13526', 700: '#D6272D' } /* grises y rojo */,
            cream: '#FFFFFF',
            accent: '#E13526',
            ink: '#1E1E1E'
          },
          fontFamily: {
            display: ['Anton', 'Impact', 'sans-serif'],
            sans: ['Oswald', 'Arial Narrow', 'sans-serif'],
            mono: ['Oswald', 'Arial Narrow', 'sans-serif'],
            poster: ['Anton', 'Impact', 'sans-serif'],
            cond: ['Oswald', 'Arial Narrow', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    html { scroll-behavior: smooth; scroll-padding-top: 76px; }
    body { background: #FFFFFF; color: #1E1E1E; }
    .font-display { font-weight: 400; text-transform: uppercase; letter-spacing: .01em; }
    body { font-weight: 400; font-size: 18px; letter-spacing: .01em; }
    main p, main li { text-align: justify; text-wrap: pretty; hyphens: auto; -webkit-hyphens: auto; }
    main .no-justify, main .no-justify p, main .no-justify li { text-align: left; hyphens: none; }
    /* En tarjetas de columnas estrechas se alinea a la izquierda para evitar huecos grandes entre palabras */
    main [class*="grid-cols-3"] p, main [class*="grid-cols-4"] p, main [class*="grid-cols-2"] p, main [class*="grid-cols-3"] li, main [class*="grid-cols-2"] li { text-align: left; hyphens: none; }
    .reveal { opacity: 0; transform: translateY(14px); transition: opacity .7s ease, transform .7s ease; }
    .reveal.in { opacity: 1; transform: none; }
    .pend { background: #FFE9C7; color: #7A4A06; border-radius: 4px; padding: 0 5px; font-family: Oswald, sans-serif; font-size: .85em; }
    .contour { animation: drift 40s ease-in-out infinite alternate; transform-origin: center; }
    .contour:nth-child(2n) { animation-duration: 55s; animation-direction: alternate-reverse; }
    @keyframes drift { from { transform: rotate(-2deg) scale(1); } to { transform: rotate(3deg) scale(1.04); } }
    .float-a { animation: floaty 9s ease-in-out infinite alternate; }
    .float-b { animation: floaty 11s ease-in-out infinite alternate-reverse; }
    @keyframes floaty { from { transform: translateY(0); } to { transform: translateY(-10px); } }
    .modal-in { animation: modalIn .25s ease both; }
    @keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
    .photo img { transition: transform .8s ease; }
    .photo:hover img { transform: scale(1.04); }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .reveal { opacity: 1; transform: none; transition: none; }
      .contour, .modal-in, .float-a, .float-b { animation: none; }
      .photo img { transition: none; }
    }
    :focus-visible { outline: 2px solid #D6272D; outline-offset: 3px; }
  </style>
</head>
<body class="font-sans antialiased">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>

  <script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
